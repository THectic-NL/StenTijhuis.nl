server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json
                    image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options         "DENY"                                    always;
    add_header X-Content-Type-Options  "nosniff"                                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Korte cache voor CSS en JS: geen fingerprinting, dus niet immutable
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control           "public, no-transform"                    always;
        add_header X-Frame-Options         "DENY"                                    always;
        add_header X-Content-Type-Options  "nosniff"                                  always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }

    # Lange cache voor afbeeldingen en fonts: veranderen zelden, immutable veilig
    location ~* \.(avif|webp|png|jpg|jpeg|gif|svg|ico|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control           "public, immutable"                        always;
        add_header X-Frame-Options         "DENY"                                     always;
        add_header X-Content-Type-Options  "nosniff"                                  always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }
}
