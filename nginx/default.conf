server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json
                    image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload"                                                                                                                                                                                                                                    always;
    add_header X-Frame-Options              "DENY"                                                                                                                                                                                                                                                                             always;
    add_header X-Content-Type-Options       "nosniff"                                                                                                                                                                                                                                                                          always;
    add_header Referrer-Policy              "no-referrer"                                                                                                                                                                                                                                                                      always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)"                                                                                                                                                  always;
    add_header Content-Security-Policy      "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none';" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                                                                                                                                                                                                                                                                      always;
    add_header Cross-Origin-Resource-Policy "same-origin"                                                                                                                                                                                                                                                                      always;
    add_header Cross-Origin-Embedder-Policy "require-corp"                                                                                                                                                                                                                                                                     always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Korte cache voor CSS en JS: geen fingerprinting, dus niet immutable
    location ~* \.(css|js)$ {
        add_header Cache-Control            "public, max-age=86400, no-transform"                                                                                                                                                                                                                                               always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"                                                                                                                                                                                                                                    always;
        add_header X-Frame-Options          "DENY"                                                                                                                                                                                                                                                                             always;
        add_header X-Content-Type-Options   "nosniff"                                                                                                                                                                                                                                                                          always;
        add_header Referrer-Policy          "no-referrer"                                                                                                                                                                                                                                                                      always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)"                                                                                                                                                  always;
        add_header Content-Security-Policy  "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none';" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"                                                                                                                                                                                                                                                                  always;
        add_header Cross-Origin-Resource-Policy "same-origin"                                                                                                                                                                                                                                                                  always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                                                                                                                                                                                                                                                                 always;
    }

    # Lange cache voor afbeeldingen en fonts: veranderen zelden, immutable veilig
    location ~* \.(avif|webp|png|jpg|jpeg|gif|svg|ico|woff2|woff)$ {
        add_header Cache-Control            "public, max-age=31536000, immutable"                                                                                                                                                                                                                                               always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"                                                                                                                                                                                                                                    always;
        add_header X-Frame-Options          "DENY"                                                                                                                                                                                                                                                                             always;
        add_header X-Content-Type-Options   "nosniff"                                                                                                                                                                                                                                                                          always;
        add_header Referrer-Policy          "no-referrer"                                                                                                                                                                                                                                                                      always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)"                                                                                                                                                  always;
        add_header Content-Security-Policy  "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none';" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"                                                                                                                                                                                                                                                                  always;
        add_header Cross-Origin-Resource-Policy "same-origin"                                                                                                                                                                                                                                                                  always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                                                                                                                                                                                                                                                                 always;
    }
}
