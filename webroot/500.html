<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal server error</title>
    <link rel="stylesheet" href="/css/500.css" />
  </head>
  <body>
    <div class="noise"></div>
    <div class="overlay"></div>

    <main class="terminal">
      <h1>Error <span class="errorcode">{{status_code}}</span></h1>
      <p class="output">Something went wrong on the server side. Please try again in a few minutes.</p>
      <p class="output">Try <a href="#1" class="errorcode">going back</a> or <a href="https://stentijhuis.nl/" class="errorcode">return to the homepage</a>.</p>
    </main>

    <script src="/js/main.js" defer></script>
  </body>
</html>
