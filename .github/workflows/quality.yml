name: Code quality

on:
  push:
    branches: [main]
    paths:
      - 'webroot/**'
      - '*.md'
      # Alle workflows, niet alleen deze: actionlint en zizmor hieronder lezen
      # ze allemaal, dus een wijziging in security.yml hoort deze job ook te
      # starten.
      - '.github/workflows/**'
      - '.markdownlint.yml'
  pull_request:
    branches: [main]

# Geen token nodig; jobs die dat wel zijn, vragen er expliciet om.
permissions: {}

# Drie keer achter elkaar naar dezelfde PR pushen startte drie volledige runs,
# en de eerste twee zijn op dat moment al achterhaald. Op main niet annuleren:
# daar is de run de vastlegging dat die commit door de controles kwam.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # HTMLHint on the site, actionlint and zizmor on the workflows. These were
  # two separate jobs (plus zizmor as a third in security.yml), and every one of
  # them finishes in seconds. GitHub bills per job and rounds each up to a whole
  # minute, so three runners cost three minutes for well under one minute of
  # work.
  #
  # Every step runs on !cancelled(), so one red linter does not hide the others.
  # The job still fails as soon as anything is wrong.
  lint:
    name: Lint the site and the workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Voor de SARIF-upload van zizmor hieronder.
      security-events: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # None of these steps push, so the token does not need to stay behind
          # in .git/config where a later step could pick it up.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      # Pinned, so a new HTMLHint major cannot turn a green build red overnight
      # without anyone changing a line here. Renovate keeps it current.
      # `npm ci` tegen een ingecheckte package-lock.json (.github/htmlhint/) in
      # plaats van `npm install -g htmlhint@versie`: die tweede haalt op runtime
      # iets uit de registry zonder dat er iets is om het resultaat tegen te
      # verifiëren, en daar slaan zowel Scorecards Pinned-Dependencies als
      # zizmors adhoc-packages op aan. `npm ci` installeert exact wat de
      # integrity-hashes in de lockfile zeggen, en een versiebump is gewoon een
      # Renovate-PR op die lockfile.
      - name: Install HTMLHint
        run: npm ci --prefix .github/htmlhint

      # HTMLHint: structural errors, missing attributes, accessibility.
      - name: Check HTML
        if: ${{ !cancelled() }}
        run: .github/htmlhint/node_modules/.bin/htmlhint "webroot/**/*.html"

      # markdownlint: houdt de Markdown in de repository consistent. De regelset
      # staat in .markdownlint.yml, hetzelfde bestand als in de andere
      # Hugo-repositories.
      #
      # Als stap en niet als eigen job: hij deelt de checkout hierboven en is in
      # seconden klaar, dus een eigen runner kostte een volle minuut voor niets.
      - name: Run markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            webroot/**/*.md
            *.md

      # Vastgezette release plus checksum, in plaats van een script vanaf een
      # branch rechtstreeks door bash halen.
      - name: Install actionlint
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSL --fail-with-body -o actionlint.tar.gz \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      # actionlint: syntaxfouten en onjuiste expressies in de workflows.
      - name: Run actionlint
        if: ${{ !cancelled() }}
        run: actionlint -color

      # zizmor used to be its own job in security.yml. It lints the same files
      # as actionlint, only on security rather than syntax, so it belongs beside
      # it rather than on a runner of its own.
      #
      # pipx and not pip: the runner's system Python is externally managed
      # (PEP 668), so a plain pip install aborts.
      - name: Install zizmor
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.30.0"
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: Run zizmor
        if: ${{ !cancelled() }}
        run: zizmor --format sarif . > zizmor.sarif || true

      # De resultaten verschijnen op het Security-tabblad van de repository.
      # Advanced Security staat organisatiebreed aan, dus dit werkt ook op een
      # privérepository.
      - name: Upload zizmor results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor
