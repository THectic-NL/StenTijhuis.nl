# docker compose up -d start de statische site in een nginx-container.
services:
  stentijhuis:
    image: thectic/stentijhuis.nl:${version:-latest}

    # Alleen een lokale image-tag; deze image wordt NIET naar Docker Hub gepubliceerd.
    # docker compose up --build bouwt 'm altijd lokaal uit de Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile

    # Poort 8080 op de host, poort 8080 in de container (unprivileged, nginx draait als niet-root)
    ports:
      - "8080:8080"

    container_name: stentijhuis

    # Herstart automatisch bij crashen of na rebooten van de host
    restart: always
